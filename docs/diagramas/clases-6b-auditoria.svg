alified-name="GMN14" id="ent0015" data-source-line="32"><path d="M393.5,126 L393.5,193 L381.672,197 L393.5,201 L393.5,267.988 A3,3 0 0 0 396.5,270.988 L570.283,270.988 A3,3 0 0 0 573.283,267.988 L573.283,133 L563.283,123 L396.5,123 A3,3 0 0 0 393.5,126" style="stroke:#999;stroke-width:0.5;" fill="#FFFBE6"/><path d="M563.283,123 L563.283,131.5 A1.5,1.5 0 0 0 564.783,133 L573.283,133 L563.283,123" style="stroke:#999;stroke-width:0.5;" fill="#FFFBE6"/><text x="399.5" y="139.256" fill="#000" font-size="12" textLength="126.381" font-family="Arial">Registrar es interno (~):</text><text x="399.5" y="153.055" fill="#000" font-size="12" textLength="132.762" font-family="Arial">ninguna pantalla lo llama</text><text x="399.5" y="166.854" fill="#000" font-size="12" textLength="140.098" font-family="Arial">ni elige el autor: lo pone el</text><text x="399.5" y="180.652" fill="#000" font-size="12" textLength="158.783" font-family="Arial">negocio desde la sesión o, en</text><text x="399.5" y="194.451" fill="#000" font-size="12" textLength="154.775" font-family="Arial">la recuperación, que no tiene</text><text x="399.5" y="208.25" fill="#000" font-size="12" textLength="145.436" font-family="Arial">sesión, desde la cuenta del</text><text x="399.5" y="222.049" fill="#000" font-size="12" textLength="38.695" font-family="Arial">código.</text><text x="399.5" y="235.848" fill="#000" font-size="12" textLength="148.758" font-family="Arial">Hasta la fase 8a era público</text><text x="399.5" y="249.646" fill="#000" font-size="12" textLength="121.389" font-family="Arial">y recibía el autor como</text><text x="399.5" y="263.445" fill="#000" font-size="12" textLength="60.703" font-family="Arial">argumento.</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0006" id="lnk8" data-link-type="dependency"><polygon points="238.286,160.491,233.327,151.981,234.231,157.565,228.647,158.469,238.286,160.491" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimi