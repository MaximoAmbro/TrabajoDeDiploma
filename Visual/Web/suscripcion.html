<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Mi suscripción</title>
<link rel="stylesheet" href="sistema.css">
<link rel="stylesheet" href="suscripcion.css">
<script defer src="entrada-puente.js"></script>
<script defer src="suscripcion.js"></script>
</head>
<body>
<main class="suscripcion-page pila pila-6">
  <p class="estado-suscripcion n3" id="estado" role="status" aria-live="polite"></p>
  <fieldset class="planes" id="planes">
    <legend class="solo-lector">Elegí un plan</legend>
    <label class="plan">
      <input type="radio" name="plan" value="Mensual" checked>
      <span class="plan-contenido pila pila-3"><span class="n3">Mensual</span><strong class="precio" id="precio-mensual"></strong><span class="secundario n5">por mes</span></span>
    </label>
    <label class="plan">
      <input type="radio" name="plan" value="Anual">
      <span class="plan-contenido pila pila-3"><span class="n3">Anual</span><strong class="precio" id="precio-anual"></strong><span class="secundario n5">por año</span><span class="ahorro" id="ahorro"></span></span>
    </label>
  </fieldset>
  <section class="beneficios pila pila-4" aria-labelledby="titulo-beneficios">
    <h2 class="n3" id="titulo-beneficios">Beneficios incluidos</h2>
    <ul class="lista-beneficios">
      <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 20 6v5.5c0 4.7-3.2 8-8 9.5-4.8-1.5-8-4.8-8-9.5V6z"/><path d="m8.5 12 2.2 2.2 4.8-5"/></svg><span>Seguro de entrada sin cargo</span></li>
      <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5m0 1h13l-2.5 3L17 12H4"/><path d="M8 16h12"/></svg><span>Preventa exclusiva de eventos</span></li>
      <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18h16M6 18V9l6-4 6 4v9M9 18v-5h6v5"/></svg><span>Prioridad en las listas de espera</span></li>
    </ul>
    <p class="secundario n5">Sin descuento extra: rige el de tu nivel. No se renueva automáticamente.</p>
  </section>
  <div class="acciones-suscripcion">
    <button type="button" class="boton boton-secundario oculto" id="cancelar">Cancelar suscripción</button>
    <button type="button" class="boton boton-primario" id="contratar">Contratar</button>
  </div>
  <p class="aviso aviso-error oculto" id="error" role="alert"></p>
</main>
<dialog class="dialogo-suscripcion" id="confirmacion" aria-labelledby="confirmacion-titulo" aria-describedby="confirmacion-detalle">
  <form method="dialog" id="form-confirmacion">
    <h2 class="n3" id="confirmacion-titulo">Confirmar suscripción</h2>
    <div class="detalle-confirmacion pila pila-3" id="confirmacion-detalle"></div>
    <p class="secundario n5">La suscripción no se renueva automáticamente al vencer.</p>
    <div class="acciones-confirmacion">
      <button type="button" class="boton boton-secundario" id="volver-confirmacion">Volver</button>
      <button type="submit" class="boton boton-primario" id="aceptar-confirmacion">Confirmar suscripción</button>
    </div>
  </form>
</dialog>
</body>
</html>
